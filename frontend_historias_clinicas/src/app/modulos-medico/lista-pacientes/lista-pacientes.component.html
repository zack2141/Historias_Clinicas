<div class="main-container">
  <h2>Lista de pacientes</h2>

  <div class="date-selector">
    <input type="date" [(ngModel)]="fechaSeleccionada" (change)="ver_lista_pacientes()" />
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Identificación</th>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th>Motivo</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cita of lista_citas">
          <td>{{ cita.fecha | date: 'dd-MM-yyyy' }}</td>
          <td>{{ cita.hora }}</td>
          <td>{{ cita.idPaciente.idPaciente }}</td>
          <td>{{ cita.idPaciente.nombres }}</td>
          <td>{{ cita.idPaciente.apellidos }}</td>
          <td>{{ cita.motivoCita }}</td>
          <td>
            <button class="btn-atender" (click)="redireccion_historia(cita)">Atender</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
