<div class="container">
    <h2>Mi perfil</h2>
    <form #formulario="ngForm" (ngSubmit)="actualizarPaciente()">
      <div class="form-row">
  
        <div class="form-group">
          <label>No. del Documento:</label>
          <input type="text" [(ngModel)]="paciente.usuarioPaciente" name="idPaciente" readonly>
        </div>
  
        <div class="form-group">
          <label>Nombres:</label>
          <input type="text" [(ngModel)]="paciente.idpaciente.nombres" name="nombres" required>
        </div>
  
        <div class="form-group">
          <label>Apellidos:</label>
          <input type="text" [(ngModel)]="paciente.idpaciente.apellidos" name="apellidos" required>
        </div>
  
        <div class="form-group">
          <label>Fecha de nacimiento:</label>
          <input type="date" [(ngModel)]="paciente.idpaciente.fechaNacimiento" name="fechaNacimiento" readonly>
        </div>
  
        <div class="form-group">
          <label>Teléfono:</label>
          <input type="text" [(ngModel)]="paciente.idpaciente.telefono" name="telefono">
        </div>
  
        <div class="form-group">
          <label>Correo:</label>
          <input type="email" [(ngModel)]="paciente.idpaciente.correo" name="correo" required>
        </div>
  
        <div class="form-group">
          <label>Dirección:</label>
          <input type="text" [(ngModel)]="paciente.idpaciente.direccion" name="direccion">
        </div>
  
        <div class="form-group">
          <label>Sexo:</label>
          <select [(ngModel)]="paciente.idpaciente.sexo" name="sexo" required>
            <option value="">Seleccione su sexo</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
  
        <div class="form-group">
          <label>Estado civil:</label>
          <input type="text" [(ngModel)]="paciente.idpaciente.estadoCivil" name="estadoCivil">
        </div>
  
        <div class="form-group">
          <label>Afiliación:</label>
          <input type="text" [(ngModel)]="paciente.idpaciente.afiliacion" name="afiliacion">
        </div>

        <div class="rh">
        <div class="form-group">
          <label>RH:</label>
          <input type="text" [(ngModel)]="paciente.idpaciente.rh" name="rh" readonly>
        </div>
        </div>
  
      </div>
  
      <button type="submit">Actualizar</button>
    </form>
  </div>
